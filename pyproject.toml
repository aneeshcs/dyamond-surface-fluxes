[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dyamond-fluxes"
version = "0.1.0"
description = "Surface flux analysis of the coupled GEOS-MITgcm DYAMOND (c1440-LLC2160) simulation on SciServer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aneesh Subramanian", email = "aneeshcs@colorado.edu" }]
dependencies = [
    "numpy>=1.24",
    "xarray>=2023.1",
    "dask[distributed]>=2023.1",
    "zarr>=2.14",
    "netcdf4>=1.6",
    "matplotlib>=3.7",
    "cmocean>=3.0",
]

[project.optional-dependencies]
# Cartopy is optional: plotting falls back to plain lat/lon axes without it.
maps = ["cartopy>=0.22"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
